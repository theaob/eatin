name: Android

on:
  push:
    paths: ['android/**', 'index.html', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'index.html', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Debug APK (signed with the runner's debug key) and an unsigned
      # release bundle; sign both locally with the project keys, see README.
      - run: ./gradlew --no-daemon assembleDebug bundleRelease -PversionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: eatin-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
