name: Android

on:
  push:
    paths: ['android/**', 'index.html', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'index.html', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Debug APK (signed with the runner's debug key) and an unsigned
      # release bundle; sign both locally with the project keys, see README.
      - run: ./gradlew --no-daemon assembleDebug bundleRelease -PversionCode=$((100 + ${{ github.run_number }}))
      - uses: actions/upload-artifact@v4
        with:
          name: eatin-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
      # Rolling pre-release with the newest build, easy to open on a phone.
      - name: Update the android-latest pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk EatIn-debug-ci.apk
          cp app/build/outputs/bundle/release/app-release.aab EatIn-release-unsigned.aab
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest --prerelease --target "$GITHUB_SHA" \
            --title "Latest Android build ($GITHUB_REF_NAME, run $GITHUB_RUN_NUMBER)" \
            --notes "Built from $GITHUB_SHA. The APK is signed with the CI runner's debug key; the AAB is unsigned. See android/README.md to sign them." \
            EatIn-debug-ci.apk EatIn-release-unsigned.aab
