name: Pages

# Publishes https://theaob.github.io/eatin/ :
#   /              the landing page (site/index.html, with site/img)
#   /play/         the game itself (index.html)
#   /privacy.html  the privacy policy
# Needs Settings > Pages > Source set to "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ['site/**', 'index.html', 'privacy.html', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/play
          cp -r site/. _site/
          cp index.html _site/play/index.html
          cp privacy.html _site/privacy.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
